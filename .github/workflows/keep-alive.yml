name: Keep Streamlit App Awake

on:
  schedule:
    # Runs at minute 0 past every 6th hour (00:00, 06:00, 12:00, 18:00 UTC).
    # GitHub's cron scheduler is best-effort and can be delayed by a few
    # minutes during high load, which is fine for this purpose.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: pip install -r keepalive/requirements.txt

      - name: Ping the Streamlit app
        env:
          STREAMLIT_APP_URL: "https://iui-outcome-prediction-memnxer5pxjwx2j6tapp2ry.streamlit.app/"
        run: python keepalive/ping_app.py
